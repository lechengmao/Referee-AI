name: spatiotemporal_dt_gcva_cached
seed: 42
model:
  input_dim: 768
  hidden_dim: 768
  fusion_dim: 256
  fusion_heads: 4
  fusion_dropout: 0.1
  token_dropout: 0.2
  attention_entropy_weight: 0.02
  attention_entropy_floor_ratio: 0.35
  pooling_temperature: 0.25
  use_mean_residual: true
training:
  optimizer: adamw
  lr: 0.0003
  eps: 0.00000001
  weight_decay: 0.0001
  batch_size: 32
  eval_batch_size: 64
  epochs: 60
  step_size: 15
  gamma: 0.3
  workers: 0
  class_weighted: true
  class_weight_mode: sqrt_inverse_frequency
  checkpoint_metric: balanced_macro_composite
  early_stopping_patience: 10
  early_stopping_min_epochs: 15
